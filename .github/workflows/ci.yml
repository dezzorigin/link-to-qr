name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Build (Vite)
        run: npm run build
      - name: Smoke check build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -n "$(ls dist/assets/*.js)" || (echo "no JS bundle in dist/assets" && exit 1)
          grep -q 'id="root"' dist/index.html || (echo "root div missing in dist/index.html" && exit 1)
          echo "build output OK"
